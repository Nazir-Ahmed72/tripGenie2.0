server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;   # AI pipeline can be slow
    }

    location / {
        try_files $uri /index.html;   # needed for React Router
    }
}
