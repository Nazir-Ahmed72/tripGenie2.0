name: tripgenie-ci

services:
  ci-db:
    image: postgres:16-alpine
    container_name: ci-tripgenie-db
    environment:
      POSTGRES_USER: tripgenie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tripgenie
    volumes:
      - ci-pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "6433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripgenie -d tripgenie"]
      interval: 5s
      retries: 10

  ci-ai-service:
    image: python:3.11-slim
    container_name: ci-tripgenie-ai
    working_dir: /app
    volumes:
      - ./ai-service:/app
      - ci-pipcache:/root/.cache/pip
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY}
      FOURSQUARE_CLIENT_ID: ${FOURSQUARE_CLIENT_ID}
      FOURSQUARE_CLIENT_SECRET: ${FOURSQUARE_CLIENT_SECRET}
    ports:
      - "9001:8000"

  ci-backend:
    image: node:20-alpine
    container_name: ci-tripgenie-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install --omit=dev --no-audit --no-fund && node server.js"
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_URI: postgres://tripgenie:${POSTGRES_PASSWORD}@ci-db:5432/tripgenie
      AI_SERVICE_URL: http://ci-ai-service:8000
    depends_on:
      ci-db:
        condition: service_healthy
    ports:
      - "6001:5000"

  ci-frontend-build:
    image: node:20-alpine
    container_name: ci-tripgenie-frontend-build
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      REACT_APP_API_URL: /api
      GENERATE_SOURCEMAP: "false"
    command: sh -c "npm install --no-audit --no-fund && npm run build"

  ci-frontend:
    image: nginx:alpine
    container_name: ci-tripgenie-frontend
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./nginx/ci.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ci-frontend-build:
        condition: service_completed_successfully
      ci-backend:
        condition: service_started
    ports:
      - "4000:80"

volumes:
  ci-pgdata:
  ci-pipcache:
