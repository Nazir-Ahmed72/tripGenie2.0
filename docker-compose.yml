name: tripgenie

services:
  db:
    image: postgres:16-alpine
    container_name: tripgenie-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripgenie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tripgenie
    volumes:
      - pgdata:/var/lib/postgresql/data                         # persistent data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # creates tables on first run
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripgenie -d tripgenie"]
      interval: 5s
      retries: 10

  ai-service:
    image: nazirahmed72/tripgenie-ai:latest
    container_name: tripgenie-ai
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY}
      FOURSQUARE_CLIENT_ID: ${FOURSQUARE_CLIENT_ID}
      FOURSQUARE_CLIENT_SECRET: ${FOURSQUARE_CLIENT_SECRET}
    ports:
      - "8001:8000"

  backend:
    image: nazirahmed72/tripgenie-backend:latest
    container_name: tripgenie-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_URI: postgres://tripgenie:${POSTGRES_PASSWORD}@db:5432/tripgenie
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "5001:5000"

  frontend:
    image: nazirahmed72/tripgenie-frontend:latest
    container_name: tripgenie-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
